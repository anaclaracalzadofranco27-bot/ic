name: Bot Smart Matrix 42 - reconstruir codigo
on:
  push:
    branches: [main]
    paths:
      - 'smartv42_src/**'
      - 'tools/build_smartv42.py'
      - 'tests/**'
      - '.github/workflows/build-smartv42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recriar smartv42.py
        run: python tools/build_smartv42.py
      - name: Validar sintaxe
        run: python -m py_compile smartv42.py
      - name: Preparar testes sem CNC
        run: python -m pip install numpy Pillow
      - name: Testar Z discreto e parser hibrido
        run: python -m unittest discover -s tests -v
      - name: Bot atualiza arquivo final
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- smartv42.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add smartv42.py
            git commit -m 'build: regenerar smartv42.py [skip ci]'
            git push origin HEAD:main
          else
            echo 'smartv42.py ja esta sincronizado.'
          fi
