name: Criar estrutura modular SmartV42
on:
  push:
    branches: ['feat/smartv42-modular']
    paths:
      - 'smartv41.py'
      - 'migrate_smartv42.py'
      - 'smartv42_src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/bootstrap-smartv42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar-testar-commitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar modulos a partir da versao 41
        run: |
          if [ ! -f smartv42.py ]; then
            python migrate_smartv42.py .
          else
            python tools/build_smartv42.py
          fi
      - name: Validar sintaxe
        run: python -m py_compile smartv42.py
      - name: Instalar dependencias minimas para testes
        run: python -m pip install numpy Pillow
      - name: Executar testes sem hardware
        run: python -m unittest discover -s tests -v
      - name: Conferir arquivo gerado
        run: python tools/build_smartv42.py --check
      - name: Registrar todos os modulos e executavel
        run: |
          git add smartv42.py smartv42_src tools/build_smartv42.py tests/test_smartv42.py .github/workflows/build-smartv42.yml SMARTV42_README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: gerar SmartV42 modular validado [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
